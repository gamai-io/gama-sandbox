name: security
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install -q bandit
      - name: Bandit (high severity; B602 accepted shell surface)
        run: bandit -q -r . -lll
      - name: Secret scan
        run: |
          if grep -RInE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
             --exclude-dir=.git --exclude-dir=__pycache__ .; then
            echo "secret pattern found"; exit 1
          fi
